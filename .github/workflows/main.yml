name: Build and Push Docker Image to Docker Hub

on:
  push:
    branches:
      - main
      - qa
      - test
      - "**"  # Match any branch for temporary builds
  pull_request:
    branches:
      - main
      - qa
      - test
      - "**"

env:
  AWS_REGION: us-east-1

jobs:
  build_dockerhub_image:
    runs-on: ubuntu-latest
    environment: DOCKER  # This gives access to env-scoped secrets

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v2

      - name: Set Docker Tag
        id: set_tag
        run: |
          BRANCH="${GITHUB_REF##*/}"
          if [[ "$BRANCH" == "main" || "$BRANCH" == "qa" || "$BRANCH" == "test" ]]; then
            echo "tag=$BRANCH" >> $GITHUB_ENV
          else
            SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
            echo "tag=tmp-${SHORT_SHA}" >> $GITHUB_ENV
          fi

      - name: Log Tag
        run: echo "Docker tag: ${{ env.tag }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build Docker Image (amd64)
        run: |
          docker buildx build \
            --platform linux/amd64 \
            -t lionsentry/daily-devotionals:${{ env.tag }} \
            --load .

      - name: Push Docker Image
        if: github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'qa' || github.ref_name == 'test')
        run: |
          docker push lionsentry/daily-devotionals:${{ env.tag }}
